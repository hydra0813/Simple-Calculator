<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工具合併：H型鋼算料 + 鐵窗分格</title>
  <style>
    :root {
      --bg:#ffffff;
      --ink:#0f172a;
      --muted:#475569;
      --line:#e2e8f0;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;color:var(--ink);background:var(--bg)}
    .topbar{
      position:sticky; top:0; z-index:20;
      display:flex; gap:8px; align-items:center;
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.92);
      backdrop-filter:saturate(180%) blur(8px);
    }
    .brand{font-weight:700; font-size:14px; margin-right:6px; white-space:nowrap}
    .tabs{display:flex; gap:8px; flex-wrap:wrap}
    .tab{
      appearance:none; border:1px solid var(--line); background:#fff;
      padding:8px 10px; border-radius:999px; cursor:pointer;
      font-size:12px; color:var(--ink);
    }
    .tab.active{background:var(--ink); color:#fff; border-color:var(--ink)}
    .hint{margin-left:auto; font-size:12px; color:var(--muted); white-space:nowrap}
    @media (max-width: 820px){ .hint{display:none} }
    .stage{height:calc(100vh - 54px);}
    iframe{width:100%;height:100%;border:none;display:block;background:#fff;}
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">合併工具</div>
    <div class="tabs">
      <button class="tab active" id="tab_hbeam" type="button">H型鋼：施工圖 + 最省算料</button>
      <button class="tab" id="tab_window" type="button">鐵窗分格：目標間距 + 鐵料估算</button>
    </div>
    <div class="hint">提示：列印 / SVG / PNG / CSV 等功能在各自工具內</div>
  </div>

  <div class="stage">
    <iframe id="frame_hbeam"

      title="H型鋼算料"></iframe>

      style="display:none"
      sandbox="allow-scripts allow-same-origin allow-downloads allow-modals allow-forms allow-popups"
      title="鐵窗分格"></iframe>

  <script>
    const $ = (id) => document.getElementById(id);

    const frames = {
      hbeam: $("frame_hbeam"),
      window: $("frame_window"),
    };
    const tabs = {
      hbeam: $("tab_hbeam"),
      window: $("tab_window"),
    };

    function decodeB64ToUtf8(b64){
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
      return new TextDecoder("utf-8").decode(bytes);
    }

    function getDoc(key){
      const el = $("b64_" + key);
      const b64 = (el?.textContent || "").replace(/\s+/g, "");
      return decodeB64ToUtf8(b64);
    }

    function ensureLoaded(key){
      const f = frames[key];
      if (f.dataset.loaded) return;
      f.srcdoc = getDoc(key);
      f.dataset.loaded = "1";
    }

    function show(key){
      ensureLoaded(key);
      for (const k of Object.keys(frames)){
        frames[k].style.display = (k === key) ? "block" : "none";
        tabs[k].classList.toggle("active", k === key);
      }
    }

    tabs.hbeam.addEventListener("click", () => show("hbeam"));
    tabs.window.addEventListener("click", () => show("window"));

    show("hbeam");
  </script>
