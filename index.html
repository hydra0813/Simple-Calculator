<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>整合工具：H型鋼算料 + 鐵窗分格</title>
  <style>
    :root {
      --bg:#0b1220;
      --panel:#0f172a;
      --ink:#0f172a;
      --muted:#64748b;
      --line:#e2e8f0;
      --card:#ffffff;
      --tab:#f8fafc;
      --tabActive:#ffffff;
      --shadow: 0 10px 30px rgba(2,6,23,.12);
      --radius: 14px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;background:#f1f5f9;color:var(--ink);}
    .topbar{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:12px 14px;background:linear-gradient(90deg,#0f172a,#111827);
      color:#fff;position:sticky;top:0;z-index:10;
      border-bottom:1px solid rgba(255,255,255,.08);
    }
    .brand{display:flex;flex-direction:column;gap:2px}
    .brand b{font-size:14px;letter-spacing:.2px}
    .brand span{font-size:12px;color:rgba(255,255,255,.75)}
    .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .actions button{
      border:1px solid rgba(255,255,255,.25);
      background:rgba(255,255,255,.10);
      color:#fff;border-radius:999px;padding:8px 10px;
      font-size:12px;cursor:pointer;
    }
    .actions button:hover{background:rgba(255,255,255,.16)}

    .shell{height:calc(100vh - 56px);display:flex;flex-direction:column;}
    .tabs{
      display:flex;gap:8px;align-items:center;
      padding:10px 12px;background:#e2e8f0;border-bottom:1px solid var(--line);
    }
    .tabbtn{
      border:1px solid var(--line);
      background:var(--tab);
      color:var(--ink);
      border-radius:999px;
      padding:8px 12px;
      font-size:12px;
      cursor:pointer;
    }
    .tabbtn.active{
      background:var(--tabActive);
      border-color:#cbd5e1;
      box-shadow:0 1px 0 rgba(2,6,23,.04);
      font-weight:700;
    }
    .hint{margin-left:auto;font-size:12px;color:var(--muted)}

    .stage{
      flex:1;position:relative;padding:12px;
    }
    .pane{
      position:absolute;inset:12px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:var(--shadow);
      display:none;
    }
    .pane.active{display:block}
    iframe{width:100%;height:100%;border:0;display:block;background:#fff}

    @media (max-width: 680px){
      .shell{height:auto;min-height:calc(100vh - 56px)}
      .stage{flex:1;min-height:82vh}
      .hint{display:none}
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <b>整合工具</b>
      <span>H型鋼：施工圖＋最省算料｜鐵窗分格：目標間距</span>
    </div>
    <div class="actions">
      <button id="btn_open_new" type="button">在新分頁開啟目前工具</button>
      <button id="btn_reload" type="button">重新載入兩個工具</button>
    </div>
  </div>

  <div class="shell">
    <div class="tabs" role="tablist" aria-label="tools">
      <button class="tabbtn active" data-tab="beam" type="button">H型鋼：施工圖 + 最省算料</button>
      <button class="tabbtn" data-tab="window" type="button">鐵窗分格（目標＝間距）</button>
      <div class="hint">小提示：若要列印/PDF，請在工具內按「列印 / PDF」</div>
    </div>

    <div class="stage">
      <div class="pane active" id="pane-beam" role="tabpanel" aria-label="beam">
        <iframe id="iframe-beam" title="H型鋼：施工圖 + 最省算料"></iframe>
      </div>
      <div class="pane" id="pane-window" role="tabpanel" aria-label="window">
        <iframe id="iframe-window" title="鐵窗分格（目標＝間距）"></iframe>
      </div>
    </div>
  </div>

  function b64ToUtf8(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }

  function loadIframes() {
    document.getElementById("iframe-beam").srcdoc = b64ToUtf8(B64_BEAM);
    document.getElementById("iframe-window").srcdoc = b64ToUtf8(B64_WINDOW);
  }

  function setActive(tab) {
    const isBeam = (tab === "beam");
    document.getElementById("pane-beam").classList.toggle("active", isBeam);
    document.getElementById("pane-window").classList.toggle("active", !isBeam);
    document.querySelectorAll(".tabbtn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
    history.replaceState(null, "", "#" + tab);
  }

  function getActiveTab() {
    const h = (location.hash || "").replace("#","").trim();
    return (h === "window" || h === "beam") ? h : "beam";
  }

  function openActiveInNewTab() {
    const tab = getActiveTab();
    const html = tab === "beam" ? b64ToUtf8(B64_BEAM) : b64ToUtf8(B64_WINDOW);
    const blob = new Blob([html], {type:"text/html;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    window.open(url, "_blank", "noopener");
    // 不 revoke：新分頁仍可能需要讀取 blob；由瀏覽器在分頁關閉後回收
  }

  document.querySelectorAll(".tabbtn").forEach(btn => {
    btn.addEventListener("click", () => setActive(btn.dataset.tab));
  });

  document.getElementById("btn_reload").addEventListener("click", () => {
    loadIframes();
  });

  document.getElementById("btn_open_new").addEventListener("click", () => {
    openActiveInNewTab();
  });

  window.addEventListener("hashchange", () => setActive(getActiveTab()));

  loadIframes();
  setActive(getActiveTab());
</script>
</body>
